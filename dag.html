<!doctype html><html lang="nl"><head><meta charset="utf-8"><style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=VT323&display=swap');
*{box-sizing:border-box}
html,body{margin:0;width:1080px;height:1350px;overflow:hidden}
body{background:#F2E8D5;color:#1E1B18;font-family:'Source Serif 4',Georgia,serif}
.kop{font-family:'Playfair Display',Georgia,serif;font-weight:900;line-height:1.02;letter-spacing:-1px}
.tt{font-family:'VT323',monospace;letter-spacing:2px}
.logo{font-family:'Playfair Display',Georgia,serif;font-weight:900;line-height:1}
.logo i{font-weight:700;color:#9E2B25}
.ster{display:inline-block;vertical-align:middle}


.wrap{width:1080px;height:1350px;padding:72px;display:flex;flex-direction:column;gap:30px;position:relative}
.mast{border-top:8px solid #1E1B18;border-bottom:2px solid #1E1B18;padding:20px 0 18px;display:flex;flex-direction:column;gap:12px}
.rij{display:flex;justify-content:space-between;align-items:center}
.foto{flex-grow:1;border:2px solid #1E1B18;background:#E4D6BC center/cover no-repeat;filter:sepia(.25) contrast(1.05)}
.foto.leeg{display:flex;align-items:center;justify-content:center;filter:none}
.foto.leeg span{font-family:'Playfair Display',Georgia,serif;font-weight:900;font-style:italic;font-size:260px;color:#D89A2B;-webkit-text-stroke:4px #1E1B18}
.stempel{position:absolute;right:40px;bottom:330px;width:190px;height:190px;border-radius:50%;background:#D89A2B;border:4px solid #1E1B18;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-10deg)}
.onder{font-size:30px;line-height:1.35}
.voet{display:flex;justify-content:space-between;align-items:flex-end;gap:24px}

</style></head><body><div class="wrap">
<div class="mast"><div class="rij"><div><span class="logo" style="font-size:44px">Nostalgie<i>magie</i></span> <svg class="ster" width="32" height="32" viewBox="0 0 24 24"><path d="M12 1.5 L14.2 9.8 L22.5 12 L14.2 14.2 L12 22.5 L9.8 14.2 L1.5 12 L9.8 9.8 Z" fill="#D89A2B"/></svg></div>
<div class="tt" style="font-size:30px;color:#9E2B25">OP DEZE DAG</div></div>
<div style="font-size:26px;font-style:italic">{{datum}}</div></div>
<div class="kop" style="font-size:{{kop_size}}">{{kop}}</div>
{{{foto_block}}}
<div class="onder">{{ondertitel}}</div>
<div class="voet"><div class="logo" style="font-style:italic;font-weight:700;font-size:42px">Weet jij dit nog?</div><div style="font-size:18px;text-align:right;max-width:560px">{{bron}}</div></div>
<div class="stempel"><div class="kop" style="font-size:72px;line-height:.9;letter-spacing:0">{{jaren}}</div><div class="tt" style="font-size:28px;letter-spacing:1px">JAAR GELEDEN</div></div>
</div></body></html>
