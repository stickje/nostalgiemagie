name: Voorbereiden (ochtend)

on:
  workflow_dispatch:
    inputs:
      datum:
        description: "Optioneel: startdatum (JJJJ-MM-DD), leeg = vandaag"
        required: false
      dagen:
        description: "Aantal dagen vooruit plannen (1 = alleen vandaag, 7 = hele week)"
        required: false
        default: "1"

permissions:
  contents: write

concurrency:
  group: nostalgiemagie

jobs:
  voorbereiden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installeren
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Post maken
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAGES_URL: ${{ vars.PAGES_URL }}
          EDITOR_URL: ${{ vars.EDITOR_URL }}
          DATUM: ${{ github.event.inputs.datum }}
          DAGEN: ${{ github.event.inputs.dagen }}
        run: python prepare.py
      - name: Opslaan
        if: always()
        run: |
          git config user.name "nostalgiemagie-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs used.json
          git diff --cached --quiet || git commit -m "Posts gepland $(TZ=Europe/Amsterdam date +%F)"
          git pull --rebase
          git push
